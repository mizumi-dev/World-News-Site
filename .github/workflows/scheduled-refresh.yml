name: Scheduled news refresh

# Vercel Hobbyプランのcronは1日1回しか実行できないため、高頻度な自動更新はここで担う。
# /api/cron/refresh-shard は「現在時刻」から自動的に担当国(シャード)を決めるので、
# このワークフローは単純に一定間隔で叩くだけでよい(docs/ARCHITECTURE_REVIEW.md参照)。
# 必要なリポジトリSecrets:
#   APP_URL      - デプロイ先のURL(例: https://your-app.vercel.app)
#   CRON_SECRET  - Vercel側の環境変数 CRON_SECRET と同じ値
on:
  schedule:
    # src/app/api/cron/refresh-shard/route.ts の SHARD_INTERVAL_MINUTES と揃えること。
    # ずれるとシャード番号の進み方と実行間隔が合わず、更新されない国が出る。
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh-shard endpoint
        run: |
          # APP_URLの末尾にスラッシュが付いていると "//api/..." になり、
          # Vercel側の正規化リダイレクト(308)を踏んでしまうため取り除く。
          # -L でリダイレクトも追従する(同一ホストであればAuthorizationヘッダーも引き継がれる)。
          app_url="${APP_URL%/}"
          status=$(curl -sS -L -o response.json -w "%{http_code}" \
            --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${app_url}/api/cron/refresh-shard")
          echo "HTTP status: $status"
          cat response.json
          if [ "$status" -ge 300 ]; then
            echo "refresh-shard failed"
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
